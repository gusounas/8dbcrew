<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cabeças vão rolar</title>
    <!-- Linha que conecta o HTML ao CSS -->
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome para os ícones funcionarem -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<!-- Caixa da Marca com Imagem Estática -->
<div class="marca-topo">
    <img src="img/logo.png" alt="Logotipo da Marca">
</div>

<!-- O "card" que vai guardar todas as informações -->
<div class="card">
    <!-- Imagem de perfil -->
    <img src="img/profile.jpg" alt="Foto de Perfil" class="foto-perfil">
    
    <h1>INSCREVA-SE</h1>
    <div class="subtitulo">
        <p>Evento de Graffiti</p>
        <h2>Cabeças vão Rolar</h2>
    </div>

    <!-- Link do Instagram com ícone dentro do Card -->
    <div class="instagram-card-container">
        <a href="https://instagram.com" target="_blank" class="link-instagram-card">
            <i class="fa-brands fa-instagram"></i> @8dobemoficial
        </a>
    </div>

    <!-- Links das redes sociais -->
    <div class="links">
        <a href="https://chat.whatsapp.com/HULbZMRVR7625xKbjynQUs" target="_blank">Grupo no Whats</a>
        <a href="#" target="_blank">Fale com a Crew</a>
    </div>

    <!-- Carrossel de Imagens em Looping -->
    <p class="titulo-Projetos">Primeira edição:</p>
    <div class="carrossel-container">
        <div class="carrossel-track">
            <img src="img/loop/01.jpg" onclick="abrirPopup(this)">
            <img src="img/loop/02.jpg" onclick="abrirPopup(this)">
            <img src="img/loop/03.jpg" onclick="abrirPopup(this)">
            <img src="img/loop/04.jpg" onclick="abrirPopup(this)">
            <!-- Repetição para o loop infinito -->
            <img src="img/loop/01.jpg" onclick="abrirPopup(this)">
            <img src="img/loop/02.jpg" onclick="abrirPopup(this)">
            <img src="img/loop/03.jpg" onclick="abrirPopup(this)">
            <img src="img/loop/04.jpg" onclick="abrirPopup(this)">
        </div>
    </div>
    
    <!-- --- FORMULÁRIO DE CONTATO (ESTILO IDÊNTICO AO CARD) --- -->
    <div class="formulario-contato">
        <h3>Contato / Inscrição</h3>
        <form id="formWhatsApp" onsubmit="enviarParaWhatsApp(event)">
            <div class="campo-grupo">
                <input type="text" id="nome" placeholder="Seu Nome" required>
            </div>

            <div class="campo-grupo">
                <input type="text" id="assunto" placeholder="Assunto (Ex: Inscrição)" required>
            </div>

            <div class="campo-grupo">
                <input type="tel" id="telefone" placeholder="Telefone para retorno" required>
            </div>

            <div class="campo-grupo">
                <textarea id="mensagem" rows="3" placeholder="Sua Mensagem..." required></textarea>
            </div>

            <button type="submit" class="btn-enviar-whats">
                <i class="fa-brands fa-whatsapp"></i> Enviar para o Whats
            </button>
        </form>
    </div>

</div>

<!-- Estrutura do Pop-up (inicialmente invisível) -->
<div id="meuPopup" class="popup-overlay" onclick="fecharPopup()">
    <div class="popup-conteudo" onclick="event.stopPropagation()">
        <span class="botao-fechar" onclick="fecharPopup()">&times;</span>
        <img id="imagemPopup" src="" alt="Imagem Ampliada">
    </div>
</div>

<!-- JavaScript para envio -->
<script>
    function abrirPopup(elementoImagem) {
        const linkImagem = elementoImagem.src;
        document.getElementById('imagemPopup').src = linkImagem;
        document.getElementById('meuPopup').style.display = 'flex';
    }

    function fecharPopup() {
        document.getElementById('meuPopup').style.display = 'none';
    }

    function enviarParaWhatsApp(event) {
        event.preventDefault();

        // ⚠️ INSIRA O NÚMERO DO WHATSAPP DO GRUPO OU ADM AQUI:
        const numeroWhatsApp = "5541987253061"; 

        const nome = document.getElementById('nome').value;
        const assunto = document.getElementById('assunto').value;
        const telefone = document.getElementById('telefone').value;
        const mensagem = document.getElementById('mensagem').value;

        const textoMensagem = `*Nova Inscrição - Cabeças Vão Rolar*%0A%0A` +
                              `*Nome:* ${nome}%0A` +
                              `*Assunto:* ${assunto}%0A` +
                              `*Telefone:* ${telefone}%0A` +
                              `*Mensagem:* ${mensagem}`;

        const urlWhatsApp = `https://wa.me/${numeroWhatsApp}?text=${textoMensagem}`;
        window.open(urlWhatsApp, '_blank');
    }
</script>

<!-- Rodapé Fixo -->
<footer class="rodape-fixo">
    <div class="rodape-conteudo">
        <p>© 2026 Meu Cartão Digital. Todos os direitos reservados.</p>
        <div class="icones-contato">
            <a href="#" target="_blank" class="icone-wa" title="Fale no WhatsApp">
                <i class="fa-brands fa-whatsapp"></i>
            </a>
            <a href="https://instagram.com" target="_blank" class="icone-ig" title="Siga no Instagram">
                <i class="fa-brands fa-instagram"></i>
            </a>
        </div>
    </div>
</footer>

</body>
</html>

<!-- O código anterior do card e do carrossel continua igual, mas adicione este bloco no final da página, antes do </body> -->

<!-- Estrutura do Pop-up (inicialmente invisível) -->
<div id="meuPopup" class="popup-overlay" onclick="fecharPopup()">
     <div class="popup-conteudo" onclick="event.stopPropagation()">
         <span class="botao-fechar" onclick="fecharPopup()">&times;</span>
         <img id="imagemPopup" src="" alt="Imagem Ampliada">
     </div>
</div>

<!-- JavaScript para fazer a mágica acontecer -->
<script>
     function abrirPopup(elementoImagem) {
         // Pega o link da imagem que foi clicada
         const linkImagem = elementoImagem.src;
         // Coloca esse link dentro da imagem do pop-up
         document.getElementById('imagemPopup').src = linkImagem;
         // Mostra o pop-up na tela
         document.getElementById('meuPopup').style.display = 'flex';
     }

     function fecharPopup() {
         // Esconde o pop-up
         document.getElementById('meuPopup').style.display = 'none';
     }
</script>
